name: CI

# CI never calls a model. Unit tests use a scripted stub and block all network access.
# Recorded model responses (results/baseline/, results/full-baseline/ and results/defenses/) are
# replayed offline through the same loop, with the defense config each run was recorded with.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: No large files (over 1 MB)
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +1M)
          if [ -n "$big" ]; then echo "Files over 1 MB:"; echo "$big"; exit 1; fi
      - name: Unit tests (pytest, offline)
        run: python -m pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
